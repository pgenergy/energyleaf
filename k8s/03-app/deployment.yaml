apiVersion: apps/v1
kind: Deployment
metadata:
  name: energyleaf-app
  namespace: energyleaf
  labels:
    app: energyleaf
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energyleaf
      component: app
  template:
    metadata:
      labels:
        app: energyleaf
        component: app
    spec:
      containers:
        - name: app
          image: energyleaf-standalone:0.2
          imagePullPolicy: Never
          env:
            - name: POSTGRES_HOST
              value: "energyleaf-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: energyleaf-postgres-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: energyleaf-postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: energyleaf-postgres-secrets
                  key: POSTGRES_DB
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: energyleaf-app-secrets
                  key: CRON_SECRET
          envFrom:
            - configMapRef:
                name: energyleaf-app-config
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
